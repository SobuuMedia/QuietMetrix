ktor {
    deployment {
        port = 8080
    }
    application {
        modules = [com.quietmetrix.server.ApplicationKt.module]
    }
}

quietmetrix {
    profile = ${?QM_PROFILE}
    db {
        url = ${QM_DB_URL}
        user = ${QM_DB_USER}
        password = ${QM_DB_PASSWORD}
        poolSize = ${?QM_DB_POOL_SIZE}
    }
    auth {
        jwtSecret = ${QM_JWT_SECRET}
        jwtIssuer = ${?QM_JWT_ISSUER}
        jwtAudience = ${?QM_JWT_AUDIENCE}
        sessionTtlHours = ${?QM_SESSION_TTL_HOURS}
        # Optional: seed an initial admin user on first run.
        adminEmail = ${?QM_ADMIN_EMAIL}
        adminPassword = ${?QM_ADMIN_PASSWORD}
    }
    rateLimit {
        enabled = ${?QM_RATE_LIMIT_ENABLED}
        requestsPerSecond = ${?QM_RATE_LIMIT_RPS}
        burstPerMinute = ${?QM_RATE_LIMIT_BURST}
    }
    ipRateLimit {
        enabled = ${?QM_INGEST_IP_ENABLED}
        requestsPerSecond = ${?QM_INGEST_IP_RPS}
        burstPerMinute = ${?QM_INGEST_IP_BURST}
    }
    cors {
        # Comma-separated list of origins allowed to call the API from a browser.
        # Required in production. For the Docker stack this is the dashboard origin,
        # e.g. http://localhost:8080
        allowedOrigins = ${?QM_CORS_ALLOWED_ORIGINS}
    }
}