ktor {
    deployment {
        port = 8080
    }
    application {
        modules = [com.quietmetrix.server.ApplicationKt.module]
    }
}

quietmetrix {
    profile = ${?QM_PROFILE}
    db {
        url = ${QM_DB_URL}
        user = ${QM_DB_USER}
        password = ${QM_DB_PASSWORD}
        poolSize = ${?QM_DB_POOL_SIZE}
    }
    auth {
        jwtSecret = ${QM_JWT_SECRET}
        jwtIssuer = ${?QM_JWT_ISSUER}
        jwtAudience = ${?QM_JWT_AUDIENCE}
        sessionTtlHours = ${?QM_SESSION_TTL_HOURS}
    }
    rateLimit {
        enabled = ${?QM_RATE_LIMIT_ENABLED}
        requestsPerSecond = ${?QM_RATE_LIMIT_RPS}
        burstPerMinute = ${?QM_RATE_LIMIT_BURST}
    }
    billing {
        provider = ${?QM_BILLING_PROVIDER}
        stripeSecretKey = ${?QM_STRIPE_SECRET_KEY}
        stripeWebhookSecret = ${?QM_STRIPE_WEBHOOK_SECRET}
        adyenApiKey = ${?QM_ADYEN_API_KEY}
        adyenMerchantAccount = ${?QM_ADYEN_MERCHANT_ACCOUNT}
        adyenHmacKey = ${?QM_ADYEN_HMAC_KEY}
    }
}