openapi: 3.1.0
info:
  title: QuietMetrix Analytics API
  description: |
    Privacy-respecting analytics platform API. Both the PHP+MySQL and Kotlin+Ktor+PostgreSQL
    servers implement this contract identically. Any SDK or HTTP client works against either backend.

    ## Authentication
    - **Tracking endpoints** use a publishable, write-only, project-scoped API key via the
      `X-QM-Api-Key` header. The key only allows writes (ingest), never reads, and is scoped
      to one project. It is safe to embed in client-side code and is NOT a secret — it is
      expected to ship in browser bundles, mobile apps, and F-Droid builds. Rotate it via
      `POST /api/v1/projects/{id}/regenerate-key` (Bearer auth) when a published key is abused.
      See docs/security/publishable-api-key.md for the full threat model and abuse-defense
      controls (per-IP, per-install, quarantine, schema allowlist).
    - **Admin/Dashboard endpoints** use session authentication obtained via `POST /api/v1/auth/login`.
    - **Agents/CLIs** provisioning projects without a browser use a long-lived personal access
      token (`qm_pat_…`, header `Authorization: Bearer <token>`) minted via `POST /api/v1/tokens`
      (session-authenticated only — a token can never mint another token). `POST` and
      `GET /api/v1/projects` accept either a session token or a scoped personal access token.
      See docs/agents/setup.md.

    QuietMetrix is fully self-hosted and unlimited: all tracking and admin
    endpoints are available, with no quotas. Rate limiting is optional and
    configurable via `QM_RATE_LIMIT_*` environment variables.
  version: 0.4.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080
    description: Local self-hosted server (docker compose up --build)
  - url: https://your-domain.example
    description: Your self-hosted deployment

tags:
  - name: Tracking
    description: Public event-ingestion endpoints (API key auth)
  - name: Auth
    description: Admin authentication
  - name: Projects
    description: Project management (session auth, or a scoped personal access token for create/list)
  - name: Access Tokens
    description: Personal access tokens for agents/CLIs (session auth only) — see docs/agents/setup.md
  - name: Dashboard
    description: Aggregated analytics data
  - name: Funnels
    description: Step-conversion funnels — SDK-declared or dashboard-managed

paths:
  /api/v1/health:
    get:
      tags: [Tracking]
      operationId: healthCheck
      summary: Health check
      description: Returns server status and version. No authentication required.
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                healthy:
                  value:
                    ok: true
                    version: "0.1.0"

  /api/v1/counters:
    post:
      tags: [Tracking]
      operationId: postCounters
      summary: Submit a batch of counter deltas (aggregate-only ingest)
      description: |
        The aggregate-only ingest path: the device computes its own analysis (screen
        transitions, funnel step reached, retention bucket, ...) and sends only
        `(metric, dims) -> n` deltas. No install identifier is ever accepted on this route —
        `u` is the SDK's own "first flush of this cell today" signal, summed server-side into
        a distinct-device count with no identifier ever existing. `day` is the device's local
        date and is clamped server-side to `[today - 2, today]`.

        Each item is independently validated against a fixed per-metric dimension registry
        (unknown metric, wrong dimension set, or a value outside the allowed charset) and, if
        invalid, is quarantined rather than failing the whole batch — see `quarantined` in the
        response.
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounterBatchRequest"
            examples:
              screenFlowAndFunnel:
                summary: A screen transition and a funnel-step counter
                value:
                  sdk:
                    platform: android
                    version: "0.5.0"
                  app:
                    version: "2.4.0"
                    country: us
                  day: "2026-09-04"
                  counters:
                    - m: screen_transition
                      d: { from: Library, to: BookDetail }
                      n: 3
                      u: 1
                    - m: funnel_step
                      d: { f: checkout, rev: "7", step: "3" }
                      n: 1
                      u: 0
      responses:
        "202":
          description: Batch processed (some items may have been quarantined; see `quarantined`)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CounterBatchResponse"
        "400":
          description: Invalid request body or empty batch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                badJson:
                  value:
                    error: invalid_json
                    message: "Request body is not valid JSON"
                emptyBatch:
                  value:
                    error: empty_batch
                    message: "counters must be non-empty"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: unauthorized
                message: "Invalid or missing API key"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: rate_limit_exceeded
                message: "Rate limit exceeded. Retry after 60 seconds."
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: payload_too_large
                message: "Request body exceeds the maximum allowed size"

  /api/v1/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate as admin
      description: |
        Exchange email + password for a session token. The token must be sent as a
        `Bearer` token in the `Authorization` header on subsequent admin requests.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              email: admin@example.com
              password: securepassword123
      responses:
        "200":
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
              example:
                token: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
                user:
                  id: "usr_abc123"
                  email: admin@example.com
                  created_at: "2026-01-15T10:30:00Z"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: unauthorized
                message: "Invalid email or password"

  /api/v1/tokens:
    post:
      tags: [Access Tokens]
      operationId: createToken
      summary: Mint a personal access token
      description: |
        Session-authenticated only — a token can never mint another token. Requesting the
        `projects:create` scope requires an admin session. See docs/agents/setup.md.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenRequest"
            example:
              name: "laptop-agent"
              scopes: [projects:create]
      responses:
        "201":
          description: Token created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateTokenResponse"
        "400":
          description: Invalid name, or an unknown scope was requested
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Requested projects:create without an admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      tags: [Access Tokens]
      operationId: listTokens
      summary: List your personal access tokens
      description: Non-revoked tokens owned by the caller, newest first. Never includes plaintext.
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenListResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/tokens/{tokenId}:
    delete:
      tags: [Access Tokens]
      operationId: revokeToken
      summary: Revoke a personal access token
      security:
        - BearerAuth: []
      parameters:
        - name: tokenId
          in: path
          required: true
          schema:
            type: string
          description: The token's id, as returned by POST/GET /tokens
      responses:
        "200":
          description: Token revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: boolean
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Token not found, already revoked, or not owned by the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List all projects
      description: |
        Returns all projects owned by the authenticated user. Accepts a session token
        (any role) or a personal access token carrying `projects:create` or `projects:read`.
      security:
        - BearerAuth: []
        - PersonalAccessToken: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 100
          description: Maximum number of projects to return
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
            minimum: 0
          description: Number of projects to skip
        - name: owner_only
          in: query
          schema:
            type: boolean
            default: false
          description: When true, only return projects where the authenticated user is the owner
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectListResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a new project
      description: |
        Creates a project and returns the API key. The API key is safe to
        embed in client code. Accepts a session token (admin role) or a personal access
        token carrying the `projects:create` scope — see docs/agents/setup.md.
      security:
        - BearerAuth: []
        - PersonalAccessToken: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema:
            type: string
            maxLength: 128
          description: |
            Optional, scoped per caller. Retrying a create with the same key returns the
            earlier project (200) instead of minting a second one — but never re-shows the
            plaintext API key, which is only ever returned once, at first creation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
            example:
              name: "My App"
      responses:
        "200":
          description: A project already existed for the given Idempotency-Key. No new key is minted or shown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdempotentProjectResponse"
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
              example:
                id: "proj_xyz789"
                name: "My App"
                api_key: "qm_ak_abc123def456ghi789"
                created_at: "2026-04-30T12:00:00Z"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Project limit reached for the current plan
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: project_limit_reached
                message: "You have reached the maximum number of projects for your plan"

  /api/v1/projects/{projectId}:
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get project details
      description: Returns details for a single project.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Authenticated user is not a member of this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: forbidden
                message: "You are not a member of this project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      tags: [Projects]
      operationId: updateProject
      summary: Update project name
      description: Updates the project name. Requires owner or admin role.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
            example:
              name: "Renamed App"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not owner or admin of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: forbidden
                message: "Only owners and admins can update this project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      description: Permanently deletes the project and all associated data. Only the owner can delete.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                type: object
                required:
                  - deleted
                  - project_id
                properties:
                  deleted:
                    type: boolean
                    example: true
                  project_id:
                    type: string
                    example: "proj_xyz789"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not the project owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: forbidden
                message: "Only the project owner can delete this project"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/projects/{projectId}/members:
    get:
      tags: [Projects]
      operationId: listProjectMembers
      summary: List project members
      description: Returns all members of the project.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: List of project members
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberListResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a member of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Projects]
      operationId: addProjectMember
      summary: Add a member to the project
      description: Adds a user to the project with the specified role. Requires owner or admin role.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddMemberRequest"
            example:
              email: "collaborator@example.com"
              role: viewer
      responses:
        "201":
          description: Member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectMemberResponse"
        "400":
          description: Invalid request body or user not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not owner or admin of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/projects/{projectId}/members/{userId}:
    delete:
      tags: [Projects]
      operationId: removeProjectMember
      summary: Remove a member from the project
      description: Removes a user from the project. Requires owner or admin role.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: userId
          in: path
          required: true
          schema:
            type: string
            pattern: "^usr_[a-zA-Z0-9]+$"
          description: The user ID to remove
      responses:
        "200":
          description: Member removed
          content:
            application/json:
              schema:
                type: object
                required:
                  - removed
                properties:
                  removed:
                    type: boolean
                    example: true
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not owner or admin of the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project or member not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/projects/{projectId}/aggregates:
    get:
      tags: [Dashboard]
      operationId: getProjectAggregates
      summary: Get aggregated analytics for a project
      description: |
        Returns pre-computed aggregate metrics including top events, top screens,
        daily active users, and event counts over a time range.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: Start of time range (inclusive)
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
          description: End of time range (inclusive)
        - name: granularity
          in: query
          schema:
            type: string
            enum: [hour, day, week, month]
            default: day
          description: Time granularity for aggregations
      responses:
        "200":
          description: Aggregated analytics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AggregatesResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/projects/{projectId}/funnels:
    get:
      tags: [Funnels]
      operationId: listFunnels
      summary: List active funnels
      description: Returns all active (non-archived) funnels for the project.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      responses:
        "200":
          description: List of funnels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelsResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    post:
      tags: [Funnels]
      operationId: createFunnel
      summary: Create a funnel
      description: |
        Creates a funnel with `source: "dashboard"`. Requires the admin or developer role.
        Limited to 20 active funnels per project and 10 steps per funnel; see
        [the Funnels guide](sdk/funnels.md#limits).
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFunnelRequest"
            example:
              funnel_key: signup
              name: Signup
              steps:
                - key: view
                  event: screen_view
                  screen: signup
                - key: submit
                  event: signup_submitted
              window_seconds: 604800
      responses:
        "201":
          description: Funnel created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelResponse"
        "400":
          description: Invalid funnel definition (bad key, step count, or window)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin or developer on this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: A funnel with this key already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                error: funnel_exists
                message: "A funnel with this key already exists"

  /api/v1/projects/{projectId}/funnels/{funnelKey}:
    patch:
      tags: [Funnels]
      operationId: updateFunnel
      summary: Update a funnel
      description: |
        Updates a funnel's name, description, steps, or window. Requires the admin or
        developer role. Editing from the dashboard sets `locked: true`, after which SDK
        registration (`POST /api/v1/funnels/register`) silently skips this key.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FunnelKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateFunnelRequest"
      responses:
        "200":
          description: Funnel updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelResponse"
        "400":
          description: Invalid funnel definition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin or developer on this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Funnel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      tags: [Funnels]
      operationId: deleteFunnel
      summary: Archive a funnel
      description: |
        Archives (soft-deletes) the funnel and unlocks its key, so a matching SDK
        registration can recreate it on a future app launch. Requires the admin or
        developer role.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FunnelKey"
      responses:
        "200":
          description: Funnel archived
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: boolean
                    example: true
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not an admin or developer on this project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Funnel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/projects/{projectId}/funnels/{funnelKey}/results:
    get:
      tags: [Funnels]
      operationId: getFunnelResults
      summary: Get funnel conversion results
      description: |
        Analyzes step conversion, drop-off, and time-to-convert over the requested range.
        See [the Funnels guide](sdk/funnels.md#reading-the-results) for a worked example of
        the response fields.
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ProjectId"
        - $ref: "#/components/parameters/FunnelKey"
        - name: range
          in: query
          schema:
            type: integer
            default: 604800
          description: Lookback window in seconds, ending now (default 7 days)
        - name: breakdown
          in: query
          schema:
            type: string
            enum: [country, platform, device_class, language]
          description: Optional dimension to split results by, attributed by each actor's entry event
        - name: trend
          in: query
          schema:
            type: string
            enum: ["1"]
          description: Pass `1` to include a daily entered/converted trend series
      responses:
        "200":
          description: Funnel results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FunnelResultsResponse"
        "401":
          description: Invalid or missing session token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Funnel not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/v1/funnels/register:
    post:
      tags: [Funnels]
      operationId: registerFunnels
      summary: Register funnels declared by the SDK
      description: |
        Upserts funnel definitions declared in app code. Called automatically by the SDK on
        `init` when the declared funnels changed since the last successful registration — see
        [the registration lifecycle](sdk/funnels.md#registration-lifecycle). A funnel already
        locked by a dashboard edit is skipped, not overwritten.
      security:
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterFunnelsRequest"
      responses:
        "200":
          description: Registration result, per funnel key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterFunnelsResponse"
        "400":
          description: Invalid funnel definition in the request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid API key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-QM-Api-Key
      description: |
        Per-project API key. Safe for client-side use — allows only event ingestion,
        not reading data. Sent as the `X-QM-Api-Key` header.
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Session token obtained from `POST /api/v1/auth/login`. Sent as
        `Authorization: Bearer <token>`.
    PersonalAccessToken:
      type: http
      scheme: bearer
      bearerFormat: qm_pat_...
      description: |
        Long-lived token for agents/CLIs, minted via `POST /api/v1/tokens` (session auth
        only). Sent the same way as a session token — `Authorization: Bearer <token>` — but
        scoped and revocable, and never grants access beyond `projects:create` /
        `projects:read`. See docs/agents/setup.md.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        type: string
        pattern: "^proj_[a-zA-Z0-9]+$"
      description: Unique project identifier

    FunnelKey:
      name: funnelKey
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-z0-9_-]{1,64}$"
      description: The funnel's slug key

  schemas:
    SdkInfo:
      type: object
      required:
        - platform
        - version
      properties:
        platform:
          type: string
          enum: [android, ios, jvm, macos, linux, windows, wasmJs]
          description: SDK platform identifier
        version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+"
          description: SDK version (semver)

    CounterItem:
      type: object
      required:
        - m
        - n
      properties:
        m:
          type: string
          description: Metric name (a fixed, server-declared registry — see docs/architecture/counters.md)
          example: screen_transition
        d:
          type: object
          additionalProperties:
            type: string
          description: |
            Dimensions. Must exactly match the metric's declared required-dimension set —
            no more, no fewer — and each key/value must match the allowed charset
            (`^[a-z0-9_]{1,32}$` for keys, `^[A-Za-z0-9_.:/-]{1,128}$` for values). A
            violation quarantines this item without failing the rest of the batch.
        n:
          type: integer
          description: Occurrence count since the last flush
          example: 3
        u:
          type: integer
          enum: [0, 1]
          default: 0
          description: |
            1 only on the first flush that touched this exact cell today (the SDK's own
            signal). Summed server-side into a distinct-device count — no identifier is
            ever sent or stored.

    CounterBatchRequest:
      type: object
      required:
        - day
        - counters
      properties:
        sdk:
          $ref: "#/components/schemas/SdkInfo"
        app:
          type: object
          properties:
            version:
              type: string
              example: "2.4.0"
            country:
              type: string
              maxLength: 2
              example: us
        day:
          type: string
          format: date
          description: The device's local date. Clamped server-side to [today - 2, today].
          example: "2026-09-04"
        counters:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CounterItem"

    CounterBatchResponse:
      type: object
      required:
        - ok
        - accepted
      properties:
        ok:
          type: boolean
          example: true
        accepted:
          type: integer
          description: Number of items validated and written
          example: 2
        quarantined:
          type: integer
          default: 0
          description: Number of items rejected by the dimension registry or the per-metric cardinality cap
          example: 0

    HealthResponse:
      type: object
      required:
        - ok
        - version
      properties:
        ok:
          type: boolean
          example: true
        version:
          type: string
          example: "0.1.0"

    AcceptedResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        queued:
          type: integer
          description: Number of events queued for processing
          example: 1

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Machine-readable error code
          example: "unauthorized"
        message:
          type: string
          description: Human-readable error description
          example: "Invalid or missing API key"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8

    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: Bearer token for subsequent authenticated requests
        user:
          $ref: "#/components/schemas/UserResponse"

    UserResponse:
      type: object
      required:
        - id
        - email
        - created_at
      properties:
        id:
          type: string
          example: "usr_abc123"
        email:
          type: string
          format: email
          example: "admin@example.com"
        created_at:
          type: string
          format: date-time

    CreateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable project name
          example: "My App"
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional project description
          example: "Production mobile app tracking"

    ProjectResponse:
      type: object
      required:
        - id
        - name
        - api_key
        - created_at
      properties:
        id:
          type: string
          example: "proj_xyz789"
        name:
          type: string
          example: "My App"
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: Optional project description
          example: "Production mobile app tracking"
        api_key:
          type: string
          description: |
            Key for the `X-QM-Api-Key` header. Safe to embed in client apps.
          example: "qm_ak_abc123def456ghi789"
        plan_id:
          type: string
          nullable: true
          description: Cloud-only. Plan identifier (null for self-hosted).
          enum: [free, hobby, startup, business]
          example: "startup"
        created_at:
          type: string
          format: date-time

    ProjectListResponse:
      type: object
      required:
        - projects
      properties:
        projects:
          type: array
          items:
            $ref: "#/components/schemas/ProjectResponse"
        total:
          type: integer
          description: Total number of projects owned by the user

    IdempotentProjectResponse:
      type: object
      description: |
        Returned instead of ProjectResponse when POST /projects is retried with an
        Idempotency-Key that already matched an earlier project. Deliberately has no
        `api_key` field — the plaintext key was only ever returned once, at first creation,
        and cannot be recovered. Use `POST /projects/{id}/regenerate-key` for a new one.
      required:
        - id
        - name
        - message
      properties:
        id:
          type: string
          example: "proj_xyz789"
        name:
          type: string
          example: "My App"
        api_key_last4:
          type: string
          nullable: true
          example: "h789"
        message:
          type: string

    CreateTokenRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: Human-readable label, e.g. the machine or agent it's issued to
          example: "laptop-agent"
        scopes:
          type: array
          items:
            type: string
            enum: [projects:create, projects:read]
          description: |
            Defaults to `["projects:create"]`. Requesting `projects:create` requires an
            admin session — mirrors the `POST /projects` admin gate.
        expires_in_days:
          type: integer
          nullable: true
          minimum: 1
          description: Defaults to never-expiring.

    TokenResponse:
      type: object
      description: Never includes the plaintext token — only returned once, by POST /tokens.
      required:
        - id
        - name
        - last4
        - scopes
        - created_at
      properties:
        id:
          type: string
        name:
          type: string
        last4:
          type: string
          example: "a71b"
        scopes:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          nullable: true

    CreateTokenResponse:
      allOf:
        - $ref: "#/components/schemas/TokenResponse"
        - type: object
          required:
            - token
          properties:
            token:
              type: string
              description: Plaintext token — shown once, here, and never again. Store it now.
              example: "qm_pat_9f3c1a2b4e5d6f708192a3b4c5d6e7f8"

    TokenListResponse:
      type: object
      required:
        - tokens
      properties:
        tokens:
          type: array
          items:
            $ref: "#/components/schemas/TokenResponse"

    Plan:
      type: string
      enum: [free, hobby, startup, business]
      description: |
        - `free` — 10K events/month, 10 rps, 30-day retention, 1 project
        - `hobby` — 100K events/month, 50 rps, 90-day retention, 3 projects
        - `startup` — 1M events/month, 200 rps, 365-day retention, 10 projects
        - `business` — 10M events/month, 1000 rps, 730-day retention, 50 projects

    UpdateProjectRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
          description: New project name

    AddMemberRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          description: Email address of the user to add
        role:
          type: string
          enum: [viewer, admin]
          description: Member role

    ProjectMemberResponse:
      type: object
      required:
        - id
        - project_id
        - user_id
        - email
        - role
        - created_at
      properties:
        id:
          type: string
          example: "mem_abc123"
        project_id:
          type: string
          example: "proj_xyz789"
        user_id:
          type: string
          example: "usr_def456"
        email:
          type: string
          format: email
          example: "collaborator@example.com"
        role:
          type: string
          enum: [viewer, admin]
        created_at:
          type: string
          format: date-time

    ProjectMemberListResponse:
      type: object
      required:
        - members
        - total
      properties:
        members:
          type: array
          items:
            $ref: "#/components/schemas/ProjectMemberResponse"
        total:
          type: integer
          description: Total number of members in the project

    StoredEvent:
      type: object
      description: A persisted event as returned by the admin API
      properties:
        id:
          type: string
          example: "evt_qwerty123"
        project_id:
          type: string
          example: "proj_xyz789"
        event:
          type: string
          example: "page_view"
        screen:
          type: string
          nullable: true
          example: "home"
        props:
          type: object
          additionalProperties: true
          example:
            referrer: "https://google.com"
            language: en
        sid:
          type: string
          example: "abc123def456"
        ts:
          type: string
          format: date-time
          description: The event timestamp (preserved from client if within ±7 days, otherwise server-replaced)
          example: "2026-04-30T12:34:56Z"
        was_offline:
          type: boolean
          description: True if the event was captured while offline
          example: false
        country:
          type: string
          nullable: true
          maxLength: 2
          description: "ISO 3166-1 alpha-2 country code derived from IP (PII: IP is not stored)"
          example: "DE"
        device_class:
          type: string
          nullable: true
          enum: [desktop, mobile, tablet, bot, unknown]
          description: Device class derived from User-Agent
          example: "mobile"
        language:
          type: string
          nullable: true
          maxLength: 10
          example: "en"
        platform:
          type: string
          example: "android"
        sdk_version:
          type: string
          example: "0.4.0"
        duration_ms:
          type: integer
          format: int64
          nullable: true
          description: >
            Time-on-screen in milliseconds, promoted from the `duration_ms` prop
            into a dedicated column by both backends. On `screen_view` events
            this is the final dwell of the previous screen; on all other events
            it is the running dwell (ms elapsed on the current screen when the
            event fired). Null when no screen was active.
          example: 5200
        received_at:
          type: string
          format: date-time
          description: Server-side timestamp when the event was received
          example: "2026-04-30T12:34:57Z"

    EventListResponse:
      type: object
      properties:
        events:
          type: array
          items:
            $ref: "#/components/schemas/StoredEvent"
        total:
          type: integer
          description: Total number of events matching the filter
        limit:
          type: integer
        offset:
          type: integer

    FunnelStepDefinition:
      type: object
      required:
        - key
        - event
      properties:
        key:
          type: string
          minLength: 1
          maxLength: 64
          description: Slug identifying this step within its funnel (used by `Funnel.step(key)` in the SDK)
        event:
          type: string
          minLength: 1
          maxLength: 255
          description: Event name this step matches
        name:
          type: string
          nullable: true
          description: Display name shown in the dashboard (defaults to the key)
        screen:
          type: string
          nullable: true
          description: If set, only events with this exact screen match this step
        props:
          type: object
          additionalProperties:
            type: string
          description: >-
            If set, only events whose props exactly match ALL of these key-value pairs match
            this step. Unlike the SDK's `trackEvent(event, screen, props)` call (whose `props`
            accepts any JSON scalar, though it is never sent past the device — see the SDK's
            aggregate-only ingest), a funnel step's `props` are always string-keyed,
            string-valued exact filters compared against the event's props as strings, so a
            numeric or boolean event prop still matches a filter of the same value written as a
            string. An empty filter always serializes as `{}`, never `[]`.
          example: {}

    FunnelResponse:
      type: object
      required:
        - funnel_key
        - name
        - steps
        - window_seconds
        - source
        - locked
        - created_at
        - updated_at
      properties:
        funnel_key:
          type: string
          example: "signup"
        name:
          type: string
          example: "Signup"
        description:
          type: string
          nullable: true
        steps:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: "#/components/schemas/FunnelStepDefinition"
        window_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 7776000
          description: Conversion window in seconds (60s to 90 days), measured from the first step's match
          example: 604800
        source:
          type: string
          enum: [sdk, dashboard]
          description: Whether this funnel was auto-registered by the SDK or created/edited in the dashboard
        locked:
          type: boolean
          description: True once a dashboard edit has locked this key against further SDK auto-registration
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    FunnelsResponse:
      type: object
      required:
        - funnels
      properties:
        funnels:
          type: array
          items:
            $ref: "#/components/schemas/FunnelResponse"

    CreateFunnelRequest:
      type: object
      required:
        - funnel_key
        - name
        - steps
      properties:
        funnel_key:
          type: string
          pattern: "^[a-z0-9_-]{1,64}$"
        name:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          nullable: true
        steps:
          type: array
          minItems: 2
          maxItems: 10
          items:
            $ref: "#/components/schemas/FunnelStepDefinition"
        window_seconds:
          type: integer
          format: int64
          minimum: 60
          maximum: 7776000
          default: 604800

    UpdateFunnelRequest:
      type: object
      properties:
        name:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        steps:
          type: array
          nullable: true
          minItems: 2
          maxItems: 10
          items:
            $ref: "#/components/schemas/FunnelStepDefinition"
        window_seconds:
          type: integer
          format: int64
          nullable: true
          minimum: 60
          maximum: 7776000

    RegisterFunnelsRequest:
      type: object
      properties:
        funnels:
          type: array
          items:
            $ref: "#/components/schemas/CreateFunnelRequest"

    RegisterFunnelsResponse:
      type: object
      properties:
        registered:
          type: array
          items:
            type: string
          description: Funnel keys created or updated by this call
        skippedLocked:
          type: array
          items:
            type: string
          description: Funnel keys skipped because a dashboard edit had already locked them
        rejected:
          type: object
          additionalProperties:
            type: string
          description: Funnel keys that failed validation, mapped to the rejection reason

    FunnelStepResult:
      type: object
      required:
        - key
        - count
        - conversion_from_entry
        - conversion_from_previous
        - dropped
        - drop_rate
      properties:
        key:
          type: string
        name:
          type: string
          nullable: true
        count:
          type: integer
          description: Actors who reached this step
        conversion_from_entry:
          type: number
          format: double
          description: count / entered
        conversion_from_previous:
          type: number
          format: double
          description: count / previous step's count
        dropped:
          type: integer
          description: Actors who reached the previous step but not this one
        drop_rate:
          type: number
          format: double
        median_ms_from_previous:
          type: integer
          format: int64
          nullable: true
          description: Nearest-rank median time from the previous step, in milliseconds
        p90_ms_from_previous:
          type: integer
          format: int64
          nullable: true
          description: Nearest-rank 90th-percentile time from the previous step, in milliseconds

    FunnelBreakdownValue:
      type: object
      required:
        - value
        - entered
        - overall_conversion
        - steps
      properties:
        value:
          type: string
          description: The breakdown dimension's value for this group (e.g. a country code)
        entered:
          type: integer
        overall_conversion:
          type: number
          format: double
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FunnelStepResult"

    FunnelBreakdown:
      type: object
      required:
        - dimension
        - values
      properties:
        dimension:
          type: string
          enum: [country, platform, device_class, language]
        values:
          type: array
          items:
            $ref: "#/components/schemas/FunnelBreakdownValue"

    FunnelTrendPoint:
      type: object
      required:
        - bucket
        - entered
        - converted
        - conversion
      properties:
        bucket:
          type: string
          format: date
          description: The day (UTC) this entry cohort started on
        entered:
          type: integer
        converted:
          type: integer
        conversion:
          type: number
          format: double

    FunnelResultsResponse:
      type: object
      required:
        - funnel
        - range
        - counted_by
        - entered
        - converted
        - overall_conversion
        - steps
        - truncated
      properties:
        funnel:
          type: object
          properties:
            funnel_key:
              type: string
            name:
              type: string
            window_seconds:
              type: integer
              format: int64
            steps:
              type: array
              items:
                $ref: "#/components/schemas/FunnelStepDefinition"
        range:
          type: object
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
        counted_by:
          type: string
          enum: [install, session]
          description: |
            "install" when every matched actor had an install-hash; "session" if any fell
            back to session-scoped counting (events sent before the install-identity
            migration, or with no install-hash available) — see the
            [privacy note](sdk/funnels.md#privacy-note).
        entered:
          type: integer
          description: Actors whose first step landed inside the requested range
        converted:
          type: integer
          description: Actors who reached the last step
        overall_conversion:
          type: number
          format: double
        median_total_ms:
          type: integer
          format: int64
          nullable: true
          description: Nearest-rank median time from entry to full completion, among those who completed
        steps:
          type: array
          items:
            $ref: "#/components/schemas/FunnelStepResult"
        breakdown:
          allOf:
            - $ref: "#/components/schemas/FunnelBreakdown"
          nullable: true
        trend:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/FunnelTrendPoint"
        truncated:
          type: boolean
          description: True if the underlying event scan hit its internal row cap; narrow the range for complete results

    AggregatesResponse:
      type: object
      properties:
        project_id:
          type: string
          example: "proj_xyz789"
        from:
          type: string
          format: date-time
        to:
          type: string
          format: date-time
        granularity:
          type: string
          enum: [hour, day, week, month]
          example: "day"
        top_events:
          type: array
          items:
            type: object
            properties:
              event:
                type: string
              count:
                type: integer
          example:
            - event: page_view
              count: 12453
            - event: button_click
              count: 3871
        top_screens:
          type: array
          items:
            type: object
            properties:
              screen:
                type: string
              count:
                type: integer
          example:
            - screen: home
              count: 8932
            - screen: settings
              count: 2190
        dau:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              count:
                type: integer
          description: Distinct session IDs per day
          example:
            - date: "2026-04-28"
              count: 342
            - date: "2026-04-29"
              count: 389
            - date: "2026-04-30"
              count: 298
