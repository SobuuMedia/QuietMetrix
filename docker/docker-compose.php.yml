services:
  php:
    build:
      context: ..
      dockerfile: servers/php/Dockerfile
    ports:
      - "8080:80"
    env_file:
      - .env
    environment:
      QM_PROFILE: selfhost
      QM_DB_HOST: mysql
      QM_DB_NAME: quietmetrix
      QM_DB_USER: quietmetrix
      QM_DB_PASSWORD: ${QM_DB_PASSWORD:?QM_DB_PASSWORD must be set in docker/.env}
      QM_JWT_SECRET: ${QM_JWT_SECRET:?QM_JWT_SECRET must be set in docker/.env}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: quietmetrix
      MYSQL_USER: quietmetrix
      MYSQL_PASSWORD: ${QM_DB_PASSWORD:?QM_DB_PASSWORD must be set in docker/.env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in docker/.env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - php
    restart: unless-stopped

volumes:
  mysql_data:
  caddy_data:
  caddy_config: