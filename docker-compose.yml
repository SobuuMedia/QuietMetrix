# QuietMetrix — full self-hosted stack in one command:
#
#   cp docker/.env.example .env    # then set strong secrets
#   docker compose up --build
#
# Services: postgres -> migrate (Flyway) -> ktor (API + dashboard on :8080).
#
#   API:       http://localhost:8080/api/v1/health
#   Dashboard: http://localhost:8080/dashboard/

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: quietmetrix
      POSTGRES_USER: quietmetrix
      POSTGRES_PASSWORD: ${QM_DB_PASSWORD:?Set QM_DB_PASSWORD in .env}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quietmetrix"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: flyway/flyway:10-alpine
    command: >-
      -url=jdbc:postgresql://postgres:5432/quietmetrix
      -user=quietmetrix
      -password=${QM_DB_PASSWORD:?Set QM_DB_PASSWORD in .env}
      -locations=filesystem:/flyway/sql
      -connectRetries=10
      migrate
    volumes:
      - ./servers/ktor/migrations:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  ktor:
    build:
      context: .
      dockerfile: servers/ktor/Dockerfile
    ports:
      - "8080:8080"
    environment:
      QM_PROFILE: selfhost
      QM_DB_URL: jdbc:postgresql://postgres:5432/quietmetrix
      QM_DB_USER: quietmetrix
      QM_DB_PASSWORD: ${QM_DB_PASSWORD:?Set QM_DB_PASSWORD in .env}
      QM_JWT_SECRET: ${QM_JWT_SECRET:?Set QM_JWT_SECRET in .env}
      QM_CORS_ALLOWED_ORIGINS: ${QM_CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      # Seeds an initial admin on first run (login at /dashboard/).
      QM_ADMIN_EMAIL: ${QM_ADMIN_EMAIL:-admin@example.com}
      QM_ADMIN_PASSWORD: ${QM_ADMIN_PASSWORD:?Set QM_ADMIN_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg_data:
